name: Build and Release NINA Plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp version from Git tag (if tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $parts = $tag.Split('-')[0].Split('.')
          while ($parts.Count -lt 4) { $parts += "0" }
          $fourPartVersion = ($parts[0..3] -join '.')
          Write-Host "Stamping AssemblyVersion / AssemblyFileVersion: $fourPartVersion"

          $asmFile = "NINA.Plugin.OMCamera/Properties/AssemblyInfo.cs"
          $content = Get-Content $asmFile -Raw
          $content = $content -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$fourPartVersion`")"
          $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$fourPartVersion`")"
          Set-Content -Path $asmFile -Value $content -Encoding UTF8

      - name: Restore dependencies
        run: dotnet restore NINA.Plugin.OMCamera.sln

      - name: Build Release (x64)
        run: dotnet build NINA.Plugin.OMCamera.sln -c Release --no-restore

      - name: Package plugin artifacts
        shell: pwsh
        run: |
          $versionLabel = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "dev-${{ github.sha }}".Substring(0, 11) }
          $dllPath = "NINA.Plugin.OMCamera/bin/Release/net8.0-windows/NINA.Plugin.OMCamera.dll"
          if (!(Test-Path $dllPath)) {
            throw "Built DLL not found at $dllPath"
          }

          New-Item -ItemType Directory -Force -Path "dist/OM System Camera" | Out-Null
          Copy-Item $dllPath "dist/OM System Camera/NINA.Plugin.OMCamera.dll"
          Copy-Item $dllPath "dist/NINA.Plugin.OMCamera.dll"

          $zipName = "NINA.Plugin.OMCamera-$versionLabel-x64.zip"
          Compress-Archive -Path "dist/OM System Camera" -DestinationPath "dist/$zipName" -Force

          $dllHash = (Get-FileHash "dist/NINA.Plugin.OMCamera.dll" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          @(
            "$dllHash  NINA.Plugin.OMCamera.dll",
            "$zipHash  $zipName"
          ) | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding UTF8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NINA.Plugin.OMCamera-${{ github.ref_name }}
          path: |
            dist/NINA.Plugin.OMCamera.dll
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NINA.Plugin.OMCamera.dll
            dist/*.zip
            dist/SHA256SUMS.txt
