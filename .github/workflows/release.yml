name: Build and Release NINA Plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp version from Git tag (if tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $parts = $tag.Split('-')[0].Split('.')
          while ($parts.Count -lt 4) { $parts += "0" }
          $fourPartVersion = ($parts[0..3] -join '.')
          Write-Host "Stamping AssemblyVersion / AssemblyFileVersion: $fourPartVersion"

          $asmFile = "NINA.Plugin.OMCamera/Properties/AssemblyInfo.cs"
          $content = Get-Content $asmFile -Raw
          $content = $content -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$fourPartVersion`")"
          $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$fourPartVersion`")"
          Set-Content -Path $asmFile -Value $content -Encoding UTF8

      - name: Restore dependencies
        run: dotnet restore NINA.Plugin.OMCamera.sln

      - name: Build Release (x64)
        run: dotnet build NINA.Plugin.OMCamera.sln -c Release --no-restore

      - name: Run Regression Tests (x64)
        run: dotnet test NINA.Plugin.OMCamera.Tests/NINA.Plugin.OMCamera.Tests.csproj -c Release --no-build --verbosity normal

      - name: Package plugin artifacts & generate NINA manifest.json
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $shaShort = "${{ github.sha }}".Substring(0, 7)
          $versionLabel = if ($refName -like "v*") { $refName } else { "dev-$shaShort" }

          $tag = if ($refName -like "v*") { $refName.TrimStart('v') } else { "1.2.0.0" }
          $parts = $tag.Split('-')[0].Split('.')
          while ($parts.Count -lt 4) { $parts += "0" }

          $dllFile = Get-ChildItem -Path "NINA.Plugin.OMCamera/bin" -Filter "NINA.Plugin.OMCamera.dll" -Recurse |
                     Where-Object { $_.FullName -match "Release" } |
                     Select-Object -First 1
          if (!$dllFile) {
            throw "Built NINA.Plugin.OMCamera.dll not found under NINA.Plugin.OMCamera/bin"
          }
          Write-Host "Found built DLL: $($dllFile.FullName)"

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $dllFile.FullName "dist/NINA.Plugin.OMCamera.dll"

          $zipName = "NINA.Plugin.OMCamera.zip"
          Compress-Archive -Path "dist/NINA.Plugin.OMCamera.dll" -DestinationPath "dist/$zipName" -Force

          $dllHash = (Get-FileHash "dist/NINA.Plugin.OMCamera.dll" -Algorithm SHA256).Hash.ToUpper()
          $zipHash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToUpper()
          @(
            "$dllHash  NINA.Plugin.OMCamera.dll",
            "$zipHash  $zipName"
          ) | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding UTF8

          $manifest = [ordered]@{
            Name = "OM System Camera"
            Identifier = "e5f039a8-9d21-4f11-9a99-4d6423ca6e77"
            Version = [ordered]@{
              Major = [int]$parts[0]
              Minor = [int]$parts[1]
              Patch = [int]$parts[2]
              Build = [int]$parts[3]
            }
            Author = "Andre Gomes Lamas Otero"
            Homepage = "https://github.com/aglotero/NINA.Plugin.OMCamera"
            Repository = "https://github.com/aglotero/NINA.Plugin.OMCamera"
            License = "MIT"
            LicenseURL = "https://opensource.org/licenses/MIT"
            ChangelogURL = "https://github.com/aglotero/NINA.Plugin.OMCamera/releases"
            Tags = @("Camera", "OM System", "Olympus", "OM-1", "Mirrorless", "DSLR")
            MinimumApplicationVersion = [ordered]@{
              Major = 3
              Minor = 2
              Patch = 0
              Build = 9001
            }
            Descriptions = [ordered]@{
              ShortDescription = "Native camera driver for OM System and Olympus mirrorless cameras in N.I.N.A."
              LongDescription = "Provides native USB tethered RAW (.ORF) capture, 16-bit ADU scaling, Bulb & Timed exposures, bidirectional ISO (Gain), Shutter Speed, Lens Aperture (f-stop), and LiveView control for OM System and Olympus OM-D mirrorless cameras (OM-1, OM-1 Mark II, OM-5, E-M1X, E-M1 Mark II/III, E-M5 Mark II/III) via OM Workspace's OlyCameraLib."
              FeaturedImageURL = ""
              ScreenshotURL = ""
              AltScreenshotURL = ""
            }
            Installer = [ordered]@{
              URL = "https://github.com/aglotero/NINA.Plugin.OMCamera/releases/download/$versionLabel/NINA.Plugin.OMCamera.dll"
              Type = "DLL"
              Checksum = $dllHash
              ChecksumType = "SHA256"
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path "dist/manifest.json" -Encoding UTF8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NINA.Plugin.OMCamera-${{ github.ref_name }}
          path: |
            dist/NINA.Plugin.OMCamera.dll
            dist/NINA.Plugin.OMCamera.zip
            dist/manifest.json
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NINA.Plugin.OMCamera.dll
            dist/NINA.Plugin.OMCamera.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
